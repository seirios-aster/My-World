# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "develop"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publish only what the game needs, not the SQL setup files or the server code
      - name: Collect the site
        run: |
          mkdir _site
          cp index.html manifest.json sw.js _site/
          cp -r icons _site/
          cp -r models _site/
          cp -r assets _site/
          # the song list in the game is built from the audio files in assets/ and its folders, so uploading a song is enough
          python3 -c "import os,json;r='_site/assets';print(json.dumps(sorted(os.path.relpath(os.path.join(d,f),r).replace(os.sep,'/') for d,_,fs in os.walk(r) for f in fs if f.lower().endswith(('.mp3','.ogg','.m4a','.wav','.opus')))))" > _site/assets/music.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the game files
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
